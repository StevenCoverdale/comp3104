name: Deply React App to GitHub Pages
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x' # Use the appropriate Node.js version
      
      - name: Install dependencies and build
        run: npm install
      
      - name: Run Tests
        run: npm test
